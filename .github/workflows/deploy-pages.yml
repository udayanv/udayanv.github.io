name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widgets/color-game-v2/pnpm-lock.yaml

      - name: Install color game dependencies
        working-directory: widgets/color-game-v2
        run: pnpm install --frozen-lockfile

      - name: Test color game
        working-directory: widgets/color-game-v2
        run: pnpm test

      - name: Build color game
        working-directory: widgets/color-game-v2
        run: pnpm build

      - name: Preserve compiled color game
        run: |
          mkdir -p "$RUNNER_TEMP/color-game-v2"
          cp -R widgets/color-game-v2/dist/. "$RUNNER_TEMP/color-game-v2/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build existing Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add compiled color game to site
        run: |
          rm -rf _site/widgets/color-game-v2
          mkdir -p _site/widgets/color-game-v2
          cp -R "$RUNNER_TEMP/color-game-v2/." _site/widgets/color-game-v2/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4