name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: widgets/color-perception-trainer/pnpm-lock.yaml

      - name: Verify widget catalog
        working-directory: widgets
        run: |
          node scripts/sync-widget-catalog.mjs
          git diff --exit-code -- README.md index.html

      - name: Install color trainer dependencies
        working-directory: widgets/color-perception-trainer
        run: pnpm install --frozen-lockfile

      - name: Test color trainer
        working-directory: widgets/color-perception-trainer
        run: pnpm test

      - name: Build color trainer
        working-directory: widgets/color-perception-trainer
        run: pnpm build

      - name: Preserve compiled color trainer
        run: |
          mkdir -p "$RUNNER_TEMP/color-perception-trainer"
          cp -R widgets/color-perception-trainer/dist/. "$RUNNER_TEMP/color-perception-trainer/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build existing Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add compiled color trainer to site
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          rm -rf _site/widgets/color-perception-trainer
          mkdir -p _site/widgets/color-perception-trainer
          cp -R "$RUNNER_TEMP/color-perception-trainer/." _site/widgets/color-perception-trainer/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
