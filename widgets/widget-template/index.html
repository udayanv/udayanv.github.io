<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Describe what this widget helps someone do.">
    <title>Widget name</title>
    <link rel="stylesheet" href="../shared/styles/tokens.css">
    <link rel="stylesheet" href="../shared/styles/base.css">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="widget-shell">
      <header class="widget-intro">
        <p class="eyebrow">Widget category</p>
        <h1>Widget name</h1>
        <p>Explain the task and the expected result in one short sentence.</p>
      </header>

      <section class="widget-panel" aria-labelledby="workspace-title">
        <h2 id="workspace-title">Start here</h2>
        <p>Replace this panel with the widget’s primary interaction.</p>
        <button id="example-action" type="button">Try the action</button>
        <p id="example-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
